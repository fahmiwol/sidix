# Simpan file ini ke .github/workflows/deploy-vps.yml di repo
# Requires GitHub Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Deploy to VPS

on:
  push:
    branches:
      - work/gallant-ellis-7cd14d
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting SIDIX deployment..."
            
            git config --global --add safe.directory /opt/sidix 2>/dev/null || true
            cd /opt/sidix
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "🔄 Restarting sidix-brain..."
            pm2 restart sidix-brain --update-env
            sleep 3
            
            echo "🏥 Health check..."
            curl -s http://localhost:8765/health | python3 -m json.tool 2>/dev/null || curl -s http://localhost:8765/health
            
            echo "📦 Building frontend..."
            cd /opt/sidix/SIDIX_USER_UI
            npm run build 2>&1 | tail -10
            
            echo "🔄 Restarting sidix-ui..."
            cd /opt/sidix
            pm2 restart sidix-ui --update-env
            sleep 1
            
            echo "✅ Deploy complete!"
            pm2 status

      - name: Smoke test MCP endpoint
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🔍 Smoke test MCP..."
            curl -s -X POST http://localhost:8765/mcp \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | python3 -m json.tool 2>/dev/null || echo "MCP test failed"
            
            echo ""
            echo "🔍 Smoke test AgentCard..."
            curl -s http://localhost:8765/.well-known/agent-card.json | python3 -m json.tool 2>/dev/null || echo "AgentCard test failed"