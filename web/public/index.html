<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDIX — VPS Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid #27ae60;
            color: #27ae60;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 3rem;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }
        .service-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .service-card:hover {
            transform: translateY(-4px);
            border-color: #667eea;
        }
        .service-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }
        .service-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .service-status {
            font-size: 0.85rem;
            color: #27ae60;
        }
        .footer {
            margin-top: 3rem;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">Online</div>
        <h1>SIDIX VPS</h1>
        <p class="subtitle">Dedicated environment untuk SIDIX & web applications</p>
        
        <div class="services">
            <div class="service-card">
                <div class="service-icon">🤖</div>
                <div class="service-name">Ollama AI</div>
                <div class="service-status">● Running</div>
            </div>
            <div class="service-card">
                <div class="service-icon">🌐</div>
                <div class="service-name">Nginx Web</div>
                <div class="service-status">● Running</div>
            </div>
            <div class="service-card">
                <div class="service-icon">🛡️</div>
                <div class="service-name">Firewall</div>
                <div class="service-status">● Active</div>
            </div>
            <div class="service-card">
                <div class="service-icon">⚡</div>
                <div class="service-name">Redis Cache</div>
                <div class="service-status">● Ready</div>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by Hostinger KVM 4 · Ubuntu 22.04 · Docker</p>
            <p style="margin-top: 0.5rem;">MiganCore Ecosystem · Day 64</p>
        </div>
    </div>
</body>
</html>
