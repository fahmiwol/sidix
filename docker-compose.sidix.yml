# docker-compose.sidix.yml — SIDIX ADO Stack (Adopted from MiganCore)
# 
# Stack: Ollama + PostgreSQL 16 + pgvector + Qdrant + Redis + SIDIX API
# Target VPS: 4 vCPU / 16GB RAM (KVM 4 @ 187.77.116.139)
# 
# Usage:
#   docker compose -f docker-compose.sidix.yml up -d
#   docker compose -f docker-compose.sidix.yml logs -f api
#
# Notes:
#   - Resource limits ditune untuk 16GB (bukan 32GB migancore)
#   - Ollama num_parallel=1 untuk hemat RAM
#   - Qdrant collection limit ≤ 6 untuk safety
#   - Redis maxmemory 768mb dengan allkeys-lru

version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sidix-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "24h"
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sidix_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sidix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sidix
      POSTGRES_USER: sidix
      POSTGRES_PASSWORD: ${PG_PASSWORD:-sidix_default_change_me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sidix"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sidix_network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: sidix-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-sidix_qdrant_change_me}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sidix_network

  redis:
    image: redis:7-alpine
    container_name: sidix-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-sidix_redis_change_me}
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sidix_network

  api:
    build:
      context: ./apps/brain_qa
      dockerfile: Dockerfile
    container_name: sidix-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sidix:${PG_PASSWORD:-sidix_default_change_me}@postgres:5432/sidix
      REDIS_URL: redis://:${REDIS_PASSWORD:-sidix_redis_change_me}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-sidix_qdrant_change_me}
      OLLAMA_URL: http://ollama:11434
      SIDIX_SOUL_PATH: /app/docs/SIDIX_SOUL.md
      # Legacy env vars untuk backward compatibility
      BRAIN_QA_DATA_DIR: /app/data
      BRAIN_QA_AGENT_WORKSPACE: /app/agent_workspace
    volumes:
      - ./brain:/app/brain:ro
      - ./docs:/app/docs:ro
      - ./data/sidix:/app/data
      - ./agent_workspace:/app/agent_workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    ports:
      - "8000:8000"
    networks:
      - sidix_network

  # Optional: Nginx reverse proxy (bisa juga pakai host nginx)
  nginx:
    image: nginx:alpine
    container_name: sidix-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    networks:
      - sidix_network

networks:
  sidix_network:
    name: sidix_network
    driver: bridge

volumes:
  ollama_data:
  postgres_data:
  qdrant_data:
  redis_data:
